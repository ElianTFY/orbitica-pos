name: ORBÍTICA POS — CI Pipeline

on:
  push:
    branches: [main, develop, "fix/*", "feat/*"]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: Backend Tests & PostgreSQL Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orbitica_user
          POSTGRES_PASSWORD: orbitica_secure_password
          POSTGRES_DB: orbitica_pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Dependencies
        working-directory: apps/api
        run: pip check

      - name: Run Alembic Database Migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://orbitica_user:orbitica_secure_password@localhost:5432/orbitica_pos
          SYNC_DATABASE_URL: postgresql://orbitica_user:orbitica_secure_password@localhost:5432/orbitica_pos
        run: alembic upgrade head

      - name: Run Backend Pytest Suite
        working-directory: apps/api
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          SYNC_DATABASE_URL: sqlite:///./test.db
          JWT_SECRET_KEY: test_secret_key_at_least_32_characters_long_for_ci
          ENCRYPTION_MASTER_KEY: DEV_MASTER_KEY_32_BYTES_FOR_DEV_ONLY_123456=
        run: pytest -v --cov=app tests/

  frontend-build:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install Web Dependencies
        working-directory: apps/web
        run: npm install

      - name: TypeScript Check
        working-directory: apps/web
        run: npm run typecheck

      - name: Next.js Production Build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
