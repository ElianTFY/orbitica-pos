name: ORBÍTICA POS — CI Production Pipeline

on:
  push:
    branches: [main, develop, "fix/*", "feat/*"]
  pull_request:
    branches: [main, develop]

jobs:
  backend-ci:
    name: Backend CI & Fiscal Schema Compliance
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orbitica_user
          POSTGRES_PASSWORD: orbitica_secure_password
          POSTGRES_DB: orbitica_pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install Dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Dependencies
        working-directory: apps/api
        run: pip check

      - name: Enforce Official Hacienda v4.4 XSD Schema Integrity
        working-directory: apps/api
        run: python scripts/download_official_xsds.py --verify-only

      - name: Validate Official Fiscal Document Golden Files
        working-directory: apps/api
        run: pytest tests/test_hacienda_v44_official_documents.py -v

      - name: Execute Alembic Migrations on Live PostgreSQL
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://orbitica_user:orbitica_secure_password@localhost:5432/orbitica_pos
          SYNC_DATABASE_URL: postgresql://orbitica_user:orbitica_secure_password@localhost:5432/orbitica_pos
        run: alembic upgrade head

      - name: Run PostgreSQL Integration Tests with Live Database
        working-directory: apps/api
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://orbitica_user:orbitica_secure_password@localhost:5432/orbitica_pos
          SYNC_DATABASE_URL: postgresql://orbitica_user:orbitica_secure_password@localhost:5432/orbitica_pos
          REDIS_URL: redis://localhost:6379
          JWT_SECRET_KEY: test_secret_key_at_least_32_characters_long_for_ci
          ENCRYPTION_MASTER_KEY: DEV_MASTER_KEY_32_BYTES_FOR_DEV_ONLY_123456=
        run: pytest -m "postgres_integration" -v

      - name: Run Full Unit Test Suite with Coverage
        working-directory: apps/api
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          SYNC_DATABASE_URL: sqlite:///./test.db
          JWT_SECRET_KEY: test_secret_key_at_least_32_characters_long_for_ci
          ENCRYPTION_MASTER_KEY: DEV_MASTER_KEY_32_BYTES_FOR_DEV_ONLY_123456=
        run: pytest -m "not postgres_integration" -v --cov=app --cov-report=term

  frontend-ci:
    name: Frontend Lint, Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install Web Dependencies
        working-directory: apps/web
        run: npm install

      - name: TypeScript Static Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Next.js Production Build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
