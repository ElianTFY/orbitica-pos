version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: orbitica_pos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbitica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-orbitica_pos}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orbitica} -d ${POSTGRES_DB:-orbitica_pos}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orbitica_pos_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: orbitica_pos_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL:?required}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:?required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?required}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?required}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?required}
      SOFTWARE_PROVIDER_TAX_ID: ${SOFTWARE_PROVIDER_TAX_ID:?required}
      SOFTWARE_PROVIDER_TAX_ID_TYPE: ${SOFTWARE_PROVIDER_TAX_ID_TYPE:?required}
      SOFTWARE_PROVIDER_NAME: ${SOFTWARE_PROVIDER_NAME:?required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      HACIENDA_LIVE_EMISSION_ENABLED: ${HACIENDA_LIVE_EMISSION_ENABLED:-false}
      HACIENDA_SANDBOX_VALIDATED: ${HACIENDA_SANDBOX_VALIDATED:-false}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  hacienda-worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: orbitica_pos_hacienda_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL:?required}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:?required}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?required}
      SOFTWARE_PROVIDER_TAX_ID: ${SOFTWARE_PROVIDER_TAX_ID:?required}
      SOFTWARE_PROVIDER_TAX_ID_TYPE: ${SOFTWARE_PROVIDER_TAX_ID_TYPE:?required}
      SOFTWARE_PROVIDER_NAME: ${SOFTWARE_PROVIDER_NAME:?required}
    command: python -m app.workers.hacienda_outbox_worker

volumes:
  postgres_data:
