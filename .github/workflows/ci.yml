name: Orbítica POS CI

on:
  push:
    branches: [main, develop, "fix/**", "codex/**"]
  pull_request:
    branches: [main, develop, "fix/**"]

permissions:
  contents: read

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      ENVIRONMENT: test
      JWT_SECRET_KEY: ci_jwt_secret_key_with_more_than_32_characters
      ENCRYPTION_MASTER_KEY: ci_encryption_master_key_with_more_than_32_chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-test.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-test.txt
      - run: pip check
      - run: python scripts/download_official_xsds.py --verify-only
      - run: pytest -m "not postgres_integration" -q

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orbitica_ci
          POSTGRES_PASSWORD: orbitica_ci_password
          POSTGRES_DB: orbitica_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://orbitica_ci:orbitica_ci_password@localhost:5432/orbitica_ci
      SYNC_DATABASE_URL: postgresql://orbitica_ci:orbitica_ci_password@localhost:5432/orbitica_ci
      JWT_SECRET_KEY: ci_jwt_secret_key_with_more_than_32_characters
      ENCRYPTION_MASTER_KEY: ci_encryption_master_key_with_more_than_32_chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-test.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-test.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -m "postgres_integration" -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
