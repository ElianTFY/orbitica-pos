# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# PRUEBAS: aplicar en un workspace Hobby con cupo de PostgreSQL gratuito.
# Elegir este archivo en Blueprint Path; render.yaml contiene planes de pago.
# No incluye worker, cron ni discos de pago. No habilita emisión fiscal real.
previews:
  generation: "off"

databases:
  - name: orbitica-pos-test-db
    databaseName: orbitica_pos_test
    user: orbitica_pos_test
    region: ohio
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: web
    name: orbitica-pos-test-api
    runtime: python
    region: ohio
    plan: free
    repo: https://github.com/ElianTFY/orbitica-pos
    branch: codex/final-production-fixes
    rootDir: apps/api
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/start_render_free.sh
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: orbitica-pos-test-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_MASTER_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://orbitica-pos-test-web.onrender.com
      - key: BACKEND_CORS_ORIGINS
        value: '["https://orbitica-pos-test-web.onrender.com"]'
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: HACIENDA_LIVE_EMISSION_ENABLED
        value: "false"
      - key: HACIENDA_SANDBOX_VALIDATED
        value: "false"
      - key: EMAIL_PROVIDER
        value: BREVO
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: EMAIL_FROM_NAME
        value: Orbítica POS
      - key: STORAGE_TYPE
        value: LOCAL
      - key: LOCAL_STORAGE_DIR
        value: /tmp/orbitica-pos-test-uploads

  - type: web
    name: orbitica-pos-test-web
    runtime: node
    region: ohio
    plan: free
    repo: https://github.com/ElianTFY/orbitica-pos
    branch: codex/final-production-fixes
    rootDir: apps/web
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_API_URL
        value: /api/v1
      # Las APIs Free reciben tráfico público HTTPS, no conexiones privadas.
      - key: FASTAPI_BACKEND_URL
        value: https://orbitica-pos-test-api.onrender.com
